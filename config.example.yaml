# Photo Organizer — Configuration
#
# Copy this file to config.yaml and edit for your machine.
# config.yaml is gitignored (it holds machine-specific paths and stays local).
#
#   copy config.example.yaml config.yaml
#
# source_folders can also be populated interactively:
#   venv\Scripts\python main.py pick-sources

# --- Phase 1: Date-Based Folder Sort ---

# Folders to scan for photos. E:\Pics (the destination root) is scanned too,
# since it already has a mix of sorted and loose files — the tool recognizes
# files already correctly placed and leaves them alone.
source_folders: []

# Destination root. Final layout is <dest_root>\YYYY\YYYY-MM\<filename>
dest_root: "E:\\Pics"

# Extensions to treat as photos (case-insensitive). Confirmed library formats:
# JPG, PNG, HEIC.
supported_extensions: [".jpg", ".jpeg", ".png", ".heic"]

# Phase 1b: extensions to treat as videos (case-insensitive). Scanned and
# sorted through the same pipeline as photos, but dated via container
# metadata (not EXIF) and routed into a Video subfolder within the month
# folder: <dest_root>\YYYY\YYYY-MM\Video\ — never mixed with photo files.
video_extensions: [".mp4", ".mov", ".avi"]

# Files with no usable date (no EXIF, no filename pattern, no filesystem date)
# land here instead of being guessed at. Relative to dest_root.
unsorted_subfolder: "_unsorted\\needs_review"

# Safety default: true means no files are copied/moved/deleted, only logged
# and previewed. Flip to false (or pass --run on the CLI) once a dry-run
# looks correct.
dry_run: true

# Hash algorithm used for content-based dedup and copy verification.
hash_algorithm: "sha256"

# On a filename collision at the destination (different file, same name),
# this many hex chars of the source file's hash are appended to the stem.
collision_suffix_length: 8

# --- Database / logging ---
db_path: "data/photo_organizer.db"
log_dir: "logs"

# --- Phase 2: Content Tagging / Captioning ---

# "local" is the only implemented backend (Ollama, below) — Claude API was
# considered and explicitly decided against for this project after real
# cost estimates at 100k+ scale (see CLAUDE.md); not built.
captioning_backend: "local"
gpu_enabled: true

# How many captioned images between disk checkpoints (fsync) during a
# Phase 2 run — bounds how much work an ungraceful crash could lose.
# Also reused as Phase 1's batch-size knob (currently unused there).
batch_size: 500

# Ollama server + model. Must already be pulled (`ollama pull <name>`)
# before running Phase 2 — see README.md. Swapping models (e.g. to
# minicpm-v4.6 if qwen3-vl:2b's quality disappoints) is just this one
# line, no code change.
ollama_model: "qwen3-vl:2b"
ollama_host: "http://localhost:11434"

# Where Phase 2 appends its JSONL output (file_hash, path, caption, tags,
# date_taken, model_used, processed_at, +file_size/file_mtime for the
# resume fast-path). Loading this into the SQLite DB is a separate,
# not-yet-built step.
captions_path: "data/captions.jsonl"

# Images are downscaled (longest edge) to this many pixels before being
# sent to the model — full-size phone photos are far bigger than any
# vision encoder actually looks at; keeps inference time/memory bounded.
caption_max_dimension: 1024

# --- Phase 2b: Review/Spot-Check Tool (review_tool.py) ---
# Standalone, browser-based — separate from dashboard.py. All optional;
# each has a built-in default so this section can be omitted entirely.

# Port the local Flask server listens on (http://localhost:<port>).
review_tool_port: 5151

# How many photos per page in the grid/browse view.
review_page_size: 40

# Slideshow auto-advance interval, in seconds. Just the tool's initial
# value on launch — it's also a live, user-changeable field in the UI
# itself, not fixed to whatever's here.
review_slideshow_seconds: 5.0

# --- Phase 2d: Remote/Shared Access (review_tool.py) ---
# Standalone from Phase 1/1b/2's config above — auth + storage for the
# review tool only. See README.md's "Remote access" section for the full
# setup (adding users, running the Cloudflare Tunnel).

# One username+password pair per invited person — managed with
# `main.py review-user add/list/remove`, not by hand-editing this list.
# password_hash is a werkzeug scrypt hash, never a plaintext password.
# Empty by default: nobody can log in until at least one is added.
review_users: []
# review_users:
#   - username: dan
#     password_hash: "scrypt:32768:8:1$....."

# Session cookie's Secure flag. False (default) so the tool still works
# logging in directly over plain http://127.0.0.1 on this PC. The real
# HTTPS protection for remote access comes from the Cloudflare Tunnel
# terminating TLS at Cloudflare's edge, not from this flag — set true only
# if this will ever ONLY be opened via its https:// tunnel hostname.
session_cookie_secure: false

# How many days a login stays valid (a persistent session cookie, not a
# fresh login every visit).
session_lifetime_days: 30

# Login brute-force protection: this many failed attempts within this
# many seconds (per client IP AND per attempted username, whichever locks
# out first) blocks further attempts against that key. See src/auth.py.
login_rate_limit_attempts: 5
login_rate_limit_window_seconds: 900

# Where photo bytes are read from. "local" is the only implemented value
# today — groundwork only for a possible future cloud-storage backend
# (S3/B2/etc.), see src/storage.py. Do not change this.
storage_backend: "local"

# --- Phase 2d follow-up: Remote Access panel (dashboard.py) ---
# The Cloudflare Tunnel's name, exactly as registered via
# `cloudflared tunnel create <name>` (see README.md's "Remote access"
# section) — config-driven per this project's own rule rather than
# hardcoded, since it's specific to whichever Cloudflare account/machine
# this is set up on. dashboard.py's "Remote Access" panel runs
# `cloudflared tunnel run <this>` for its Start Tunnel button.
cloudflare_tunnel_name: "photo-viewer"

# --- Phase 2g: cached video first-frame thumbnails ---
# One JPEG per video, written by `main.py extract-thumbnails` (or the
# dashboard's own panel) to thumbnail_dir/<file_hash>.jpg and served by
# review_tool.py's /thumbnail/<file_hash> route. thumbnail_max_dimension
# is the longest edge in pixels (aspect preserved) — 480 is plenty for a
# grid tile (photos' own grid thumbs are requested at ?max=400).
thumbnail_dir: "data/thumbnails"
thumbnail_max_dimension: 480

# --- Phase 3 Session 1: face detection + embedding (src/face_detection.py,
# CLI: `main.py detect-faces`) --- (note: these three were never actually
# added to this example file during Session 1 itself -- added here as part
# of Session 2, alongside the new clustering keys below, so this file
# documents every face_*/faces_* key the code actually reads)
faces_path: "data/faces.jsonl"
faces_scanned_path: "data/faces_scanned.jsonl"
face_model_pack: "buffalo_l"

# --- Phase 3 Session 2: face clustering (src/face_clustering.py, CLI:
# `main.py cluster-faces`) --- retune after reviewing real cluster quality
# in the dashboard's Face Labeling window.
# face_min_det_score: a face below this RetinaFace confidence never gets
#   clustered (stays in the "Unclustered" bucket for manual handling).
# face_cluster_similarity_threshold: cosine similarity above which two
#   ArcFace embeddings count as the same person -- used both to match a new
#   face against an existing person's centroid and as DBSCAN's neighbor
#   radius when forming brand new clusters.
# face_cluster_min_samples: DBSCAN's min_samples -- a person seen in only 1
#   photo won't form a cluster alone until min_samples matching faces appear
#   (or the user manually creates a person from it in the labeling UI).
#
# URGENT-fix follow-up session: 0.45/2 (this project's own earlier
# small-sample tuning, 39 groups from 767 faces) was verified NOT to
# generalize to real full-library scale -- a real 61,676-face "cluster"
# (confirmed a chained mass of unrelated people, not one person) formed
# against the real ~155k-photo production DB. Raising the threshold did
# almost all the real work in testing (min_samples 2->8 alone only shrank
# the runaway cluster ~8%); 0.65/4 meaningfully reduces (does not claim to
# eliminate) chaining risk while trying not to gut match recall for
# already-named people, especially a child whose face changes a lot over
# many years. See src/config.py's Config.face_cluster_similarity_threshold
# comment and CLAUDE.md/TODO.md for the full real-data-backed writeup.
face_min_det_score: 0.5
face_cluster_similarity_threshold: 0.65
face_cluster_min_samples: 4
#
# face_match_existing_threshold (follow-up session, direct user feedback --
# real already-named people not getting recognized as often as expected):
# an OPTIONAL, separate, more lenient threshold used ONLY for "does this new
# face match an EXISTING, already-confirmed person" -- DBSCAN's new-cluster
# formation above always keeps using face_cluster_similarity_threshold
# unchanged, so lowering this can't reintroduce the chaining problem that
# threshold exists to prevent. A false match here is low-risk (one bad
# photo under a real person's name, easy to spot/fix by hand via "Remove
# Selected from Cluster" in the labeling UI) -- unlike a false match in
# brand-new cluster formation. Commented out (defaults to None, i.e. today's
# exact behavior, same value for both jobs) since the right value is a
# per-library tuning choice -- uncomment and pick a value below
# face_cluster_similarity_threshold once you've seen real match-rate
# numbers for your own named people (see src/config.py's own comment).
# face_match_existing_threshold: 0.55
#
# face_min_cluster_size_for_matching (Phase 3l, URGENT follow-up session):
# a person needs at least this many faces before they're even ELIGIBLE to
# be an automatic-matching target in a `cluster-faces` run -- a systemic
# safeguard, independent of auto_match_locked above, against a real,
# repeated incident: a brand-new person created with just a couple of
# photos (a pet, a rarely-seen relative) has a weak centroid that becomes
# a false-positive magnet the moment face_match_existing_threshold makes
# matching lenient -- hit for real three times (1-face "Joeanne Sanders",
# 5-face cluster 6367, 2-face "Luna" -- see src/config.py's own comment
# for the full real-data-backed reasoning behind the default of 6).
# auto_match_locked is still there as a manual, PERMANENT per-person
# override (e.g. for a pet you never want auto-matched even once it grows
# past this floor) -- this is additive, not a replacement for it.
face_min_cluster_size_for_matching: 6

# --- Packaged app: updates ---
# Look for a newer release shortly after the dashboard opens (one small GET
# to GitHub). Installing is always your click. Set false to only check when
# you press "Check for Updates" in the dashboard. See README: "Downloadable app".
check_for_updates: true
