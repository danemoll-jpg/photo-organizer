# Photo Organizer — Configuration
#
# Copy this file to config.yaml and edit for your machine.
# config.yaml is gitignored (it holds machine-specific paths and stays local).
#
#   copy config.example.yaml config.yaml
#
# source_folders can also be populated interactively:
#   venv\Scripts\python main.py pick-sources

# --- Phase 1: Date-Based Folder Sort ---

# Folders to scan for photos. E:\Pics (the destination root) is scanned too,
# since it already has a mix of sorted and loose files — the tool recognizes
# files already correctly placed and leaves them alone.
source_folders: []

# Destination root. Final layout is <dest_root>\YYYY\YYYY-MM\<filename>
dest_root: "E:\\Pics"

# Extensions to treat as photos (case-insensitive). Confirmed library formats:
# JPG, PNG, HEIC.
supported_extensions: [".jpg", ".jpeg", ".png", ".heic"]

# Phase 1b: extensions to treat as videos (case-insensitive). Scanned and
# sorted through the same pipeline as photos, but dated via container
# metadata (not EXIF) and routed into a Video subfolder within the month
# folder: <dest_root>\YYYY\YYYY-MM\Video\ — never mixed with photo files.
video_extensions: [".mp4", ".mov", ".avi"]

# Files with no usable date (no EXIF, no filename pattern, no filesystem date)
# land here instead of being guessed at. Relative to dest_root.
unsorted_subfolder: "_unsorted\\needs_review"

# Safety default: true means no files are copied/moved/deleted, only logged
# and previewed. Flip to false (or pass --run on the CLI) once a dry-run
# looks correct.
dry_run: true

# Hash algorithm used for content-based dedup and copy verification.
hash_algorithm: "sha256"

# On a filename collision at the destination (different file, same name),
# this many hex chars of the source file's hash are appended to the stem.
collision_suffix_length: 8

# --- Database / logging ---
db_path: "data/photo_organizer.db"
log_dir: "logs"

# --- Phase 2: Content Tagging / Captioning ---

# "local" is the only implemented backend (Ollama, below) — Claude API was
# considered and explicitly decided against for this project after real
# cost estimates at 100k+ scale (see CLAUDE.md); not built.
captioning_backend: "local"
gpu_enabled: true

# How many captioned images between disk checkpoints (fsync) during a
# Phase 2 run — bounds how much work an ungraceful crash could lose.
# Also reused as Phase 1's batch-size knob (currently unused there).
batch_size: 500

# Ollama server + model. Must already be pulled (`ollama pull <name>`)
# before running Phase 2 — see README.md. Swapping models (e.g. to
# minicpm-v4.6 if qwen3-vl:2b's quality disappoints) is just this one
# line, no code change.
ollama_model: "qwen3-vl:2b"
ollama_host: "http://localhost:11434"

# Where Phase 2 appends its JSONL output (file_hash, path, caption, tags,
# date_taken, model_used, processed_at, +file_size/file_mtime for the
# resume fast-path). Loading this into the SQLite DB is a separate,
# not-yet-built step.
captions_path: "data/captions.jsonl"

# Images are downscaled (longest edge) to this many pixels before being
# sent to the model — full-size phone photos are far bigger than any
# vision encoder actually looks at; keeps inference time/memory bounded.
caption_max_dimension: 1024

# --- Phase 2b: Review/Spot-Check Tool (review_tool.py) ---
# Standalone, browser-based — separate from dashboard.py. All optional;
# each has a built-in default so this section can be omitted entirely.

# Port the local Flask server listens on (http://localhost:<port>).
review_tool_port: 5151

# How many photos per page in the grid/browse view.
review_page_size: 40

# Slideshow auto-advance interval, in seconds. Just the tool's initial
# value on launch — it's also a live, user-changeable field in the UI
# itself, not fixed to whatever's here.
review_slideshow_seconds: 5.0
