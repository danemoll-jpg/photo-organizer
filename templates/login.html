<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Organizer — Sign in</title>
<link rel="stylesheet" href="{{ url_for('static', filename='review.css') }}">
</head>
<body class="login-body">
<main class="login-card">
  <h1>Photo Organizer</h1>
  <p class="login-sub">Sign in to view the library.</p>
  {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('login') }}{% if next %}?next={{ next|urlencode }}{% endif %}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <label>Username
      <input type="text" name="username" autocomplete="username" autofocus required>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Sign in</button>
  </form>
</main>
</body>
</html>
