<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Organizer — Review</title>
<link rel="stylesheet" href="{{ url_for('static', filename='review.css') }}">
</head>
<body>
<header class="topbar">
  <h1>Photo Organizer <span class="subtitle">— Review / Spot-Check</span></h1>
  <div class="topbar-right">
    <div id="stats" class="stats">Loading…</div>
    {% if current_user %}
    <form method="post" action="{{ url_for('logout') }}" class="logout-form">
      <input type="hidden" name="csrf_token" value="{{ logout_csrf }}">
      <span class="logged-in-as">{{ current_user }}</span>
      <button type="submit" class="logout-btn">Log out</button>
    </form>
    {% endif %}
  </div>
</header>

<section class="filters" id="filters">
  <label>From <input type="date" id="f-date-from"></label>
  <label>To <input type="date" id="f-date-to"></label>
  <label>Tag <input type="text" id="f-tag" list="f-tag-list" placeholder="Start typing an existing tag…" autocomplete="off"></label>
  <datalist id="f-tag-list"></datalist>
  <label>Caption contains <input type="text" id="f-caption-kw" placeholder="e.g. birthday cake"></label>
  <label>Location
    <!-- Grid/Viewer nav cleanup: dropdown of real, already-existing
         location_name values (populated from /api/facets), replacing the
         old free-text search -- no more guessing exact spelling/comma
         formatting. "No location" folds in the old standalone GPS
         has/no-location toggle (now redundant, removed). -->
    <select id="f-location">
      <option value="">Any</option>
      <option value="__no_location__">No location</option>
    </select>
  </label>
  <label>People/Faces
    <select id="f-people" disabled title="Face detection isn't built yet (Phase 3) — this filter will work once it is.">
      <option>Not available yet</option>
    </select>
  </label>
  <button id="f-apply">Apply</button>
  <button id="f-reset" class="secondary">Reset</button>
  <span class="filters-hint">Path is relative to <code>{{ dest_root }}</code></span>
</section>

<!-- Grid pager, duplicated top+bottom (see review.js) so browsing down a
     long page of thumbnails doesn't require scrolling back up just to
     turn the page. Both copies share classes (not ids -- ids must be
     unique) and are wired to the exact same handlers/state, kept in sync
     either way -- same pattern the viewer's nav controls used to use. -->
<section class="grid-toolbar grid-toolbar-top">
  <div class="grid-nav">
    <button class="grid-prev-btn" disabled>&larr; Prev page</button>
    <span class="grid-page-info">—</span>
    <button class="grid-next-btn" disabled>Next page &rarr;</button>
  </div>
  <div class="grid-pagesize">
    <label>Per page
      <select id="f-pagesize">
        <option value="20">20</option>
        <option value="40" selected>40</option>
        <option value="80">80</option>
        <option value="120">120</option>
      </select>
    </label>
  </div>
</section>

<main id="grid" class="grid"></main>
<div id="grid-empty" class="empty-state" hidden>No photos match these filters.</div>

<section class="grid-toolbar grid-toolbar-bottom">
  <div class="grid-nav">
    <button class="grid-prev-btn" disabled>&larr; Prev page</button>
    <span class="grid-page-info">—</span>
    <button class="grid-next-btn" disabled>Next page &rarr;</button>
  </div>
</section>

<!-- Viewer / slideshow mode -->
<div id="viewer" class="viewer" hidden>
  <div class="viewer-backdrop"></div>
  <div class="viewer-panel">
    <button id="viewer-close" class="viewer-close" title="Back to grid (Esc)">&times;</button>

    <div class="viewer-image-wrap">
      <img id="viewer-img" alt="">
      <video id="viewer-video" controls hidden></video>
      <div id="viewer-nomore" class="viewer-nomore" hidden></div>
    </div>

    <div class="viewer-details">
      <div class="viewer-path" id="viewer-path" title=""></div>
      <div class="viewer-row"><span class="label">Date taken</span><span id="viewer-date"></span></div>
      <div class="viewer-row"><span class="label">Caption</span><span id="viewer-caption"></span></div>
      <div class="viewer-row"><span class="label">Tags</span><span id="viewer-tags"></span></div>
      <div class="viewer-row"><span class="label">Location</span><span id="viewer-location"></span></div>
      <div class="viewer-row people-row"><span class="label">People</span><span id="viewer-people" class="placeholder">Face detection isn't built yet (Phase 3) — this will show who's in the photo once it is.</span></div>
    </div>

    <!-- Nav controls: a single set (Phase 2b's original placement). A
         top+bottom duplication of this block was tried here and reverted
         -- it was mistakenly built on the viewer when the original request
         was actually for the grid's pager (see review.html's
         .grid-toolbar-top/-bottom above). -->
    <div class="viewer-controls">
      <button id="viewer-prev" title="Previous (&larr;)">&larr; Prev</button>
      <button id="viewer-random" title="Jump to a random matching photo">&#128256; Random</button>
      <button id="viewer-playpause" class="play">&#9654; Play</button>
      <button id="viewer-next" title="Next (&rarr;)">Next &rarr;</button>
      <label class="order-label">Order
        <select id="viewer-order">
          <option value="chronological" selected>Chronological</option>
          <option value="random">Random</option>
        </select>
      </label>
      <label class="interval-label">Every
        <input type="number" id="viewer-interval" min="1" max="600" step="0.5" value="{{ slideshow_seconds }}">
        sec
      </label>
    </div>
  </div>
</div>

<script>
  window.REVIEW_CONFIG = {
    pageSize: {{ page_size }},
    slideshowSeconds: {{ slideshow_seconds }},
    destRoot: {{ dest_root|tojson }}
  };
</script>
<script src="{{ url_for('static', filename='review.js') }}"></script>
</body>
</html>
